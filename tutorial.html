<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>__MSG_tutorialTitle__</title>
    <link rel="stylesheet" href="styles/themes.css">
    <link rel="stylesheet" href="styles/local_styles.css">
</head>
<body>
    <main class="tutorial-page">
        <header class="tutorial-hero">
            <p class="page-kicker" data-i18n="tutorialHeroKicker"></p>
            <h1 data-i18n="tutorialHeroTitle"></h1>
            <p class="tutorial-meta" data-i18n="tutorialHeroMeta"></p>
            <section class="lang-card intro-pair">
                <p data-i18n="tutorialHeroIntro"></p>
            </section>
        </header>

        <section class="tutorial-summary">
            <article class="summary-chip">
                <h3 data-i18n="tutorialSummaryNeedTitle"></h3>
                <p data-i18n="tutorialSummaryNeedDesc"></p>
            </article>
            <article class="summary-chip">
                <h3 data-i18n="tutorialSummaryGetTitle"></h3>
                <p data-i18n="tutorialSummaryGetDesc"></p>
            </article>
            <article class="summary-chip">
                <h3 data-i18n="tutorialSummaryKnowTitle"></h3>
                <p data-i18n="tutorialSummaryKnowDesc"></p>
            </article>
        </section>

        <section class="callout-box callout-box--soft">
            <div class="lang-card">
                <h2 data-i18n="tutorialBeforeTitle"></h2>
                <ul class="bullet-list">
                    <li data-i18n="tutorialBeforeBullet1"></li>
                    <li data-i18n="tutorialBeforeBullet2"></li>
                    <li data-i18n="tutorialBeforeBullet3"></li>
                </ul>
            </div>
        </section>

        <section class="step-stack">
            <article class="step-card">
                <div class="step-shell">
                    <div class="step-number">1</div>
                    <div class="step-main">
                        <div class="lang-card">
                            <h2 data-i18n="tutorialStep1Title"></h2>
                            <p data-i18n="tutorialStep1Body"></p>
                            <a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer noopener" class="cta-btn" data-i18n="tutorialStep1Cta"></a>
                        </div>
                        <img src="images/tutorial-step1-aistudio.png" alt="Google AI Studio API key page" class="screenshot">
                    </div>
                </div>
            </article>

            <article class="step-card">
                <div class="step-shell">
                    <div class="step-number">2</div>
                    <div class="step-main">
                        <div class="lang-card">
                            <h2 data-i18n="tutorialStep2Title"></h2>
                            <p data-i18n="tutorialStep2Body"></p>
                        </div>
                        <img src="images/tutorial-step2-getkey.png" alt="Create API key flow in Google AI Studio" class="screenshot">
                    </div>
                </div>
            </article>

            <article class="step-card">
                <div class="step-shell">
                    <div class="step-number">3</div>
                    <div class="step-main">
                        <div class="lang-card">
                            <h2 data-i18n="tutorialStep3Title"></h2>
                            <p data-i18n="tutorialStep3Body"></p>
                        </div>
                        <img src="images/tutorial-step3-showkey.png" alt="Gemini API key display in Google AI Studio" class="screenshot">
                    </div>
                </div>
            </article>

            <article class="step-card">
                <div class="step-shell">
                    <div class="step-number">4</div>
                    <div class="step-main">
                        <div class="lang-card">
                            <h2 data-i18n="tutorialStep4Title"></h2>
                            <p data-i18n="tutorialStep4Body"></p>
                            <p class="success-text" data-i18n="tutorialStep4Success"></p>
                        </div>
                        <img src="images/tutorial-step4-model.png" alt="Extension options page with API key and model selection" class="screenshot">
                    </div>
                </div>
            </article>
        </section>

        <section class="callout-box callout-box--warning">
            <div class="lang-card">
                <h2 data-i18n="tutorialSafetyTitle"></h2>
                <ul class="bullet-list">
                    <li data-i18n="tutorialSafetyBullet1"></li>
                    <li data-i18n="tutorialSafetyBullet2"></li>
                    <li data-i18n="tutorialSafetyBullet3"></li>
                </ul>
            </div>
        </section>

        <section class="callout-box callout-box--soft">
            <div class="lang-card">
                <h2 data-i18n="tutorialLocalTitle"></h2>
                <p data-i18n="tutorialLocalBody"></p>
            </div>
            <img src="images/tutorial-step4-aimode.png" alt="AI mode and local model configuration in extension options" class="screenshot">
        </section>

        <section class="reference-box">
            <p data-i18n="tutorialReferences"></p>
        </section>

        <footer class="tutorial-footer">
            <p data-i18n="tutorialFooter"></p>
        </footer>
    </main>
    <script src="i18n.js"></script>
</body>
</html>
